workflows:
  ios-unsigned:
    name: iOS Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Show versions
        script: |
          flutter --version
          xcodebuild -version
      - name: Resolve packages
        script: |
          flutter pub get
          flutter build ios --release --config-only --no-codesign
      - name: Archive without signing
        script: |
          set -e
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive
      - name: Package IPA
        script: |
          set -e
          APP_PATH="$PWD/build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          test -d "$APP_PATH"
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_PATH" build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -qry Runner-unsigned.ipa Payload
          # iOS 的 Safari 对 .ipa 会跳 App Store，再包一层 zip 才能正常存进「文件」
          zip -qry Runner-unsigned-ipa.zip Runner-unsigned.ipa
          ls -lh Runner-unsigned.ipa Runner-unsigned-ipa.zip
    artifacts:
      - build/ios/ipa/Runner-unsigned-ipa.zip